# Latest release is tagged like v6.4.0.2_Linux; strip v prefix and _Linux.
[megasync-bin]
source = "github"
github = "meganz/MEGAsync"
use_max_tag = true
include_regex = ".*_Linux$"
prefix = "v"
from_pattern = "_Linux$"
to_pattern = ""

[claude-desktop-bin]
source = "cmd"
cmd = "curl -fsSL https://downloads.claude.ai/claude-desktop/apt/stable/dists/stable/main/binary-amd64/Packages | awk '/^Version:/{print $2}' | sort -V | tail -1"

["claude-code-bin"]
source = "github"
github = "anthropics/claude-code"
use_latest_release = true
prefix = "v"

[mutagen]
source = "github"
github = "quodlibet/mutagen"
use_latest_release = true
prefix = "release-"

[hyprsunset-qt]
source = "cmd"
cmd = '''curl -fsSL https://git.danix.xyz/hyprsunset-qt/refs/tags | grep -oE 'hyprsunset-qt-[0-9.]+\.tar' | sed 's/hyprsunset-qt-//;s/\.tar//' | sort -V | tail -1'''

# Typora is proprietary with no git repo, so there is no github/pypi feed.
# The Linux changelog page is the only per-platform source of truth: its
# newest <h2> is the current Linux version. Do NOT use dev_update.xml, which
# carries the macOS dev channel and reports a different version.
[typora-bin]
source = "regex"
url = "https://typora.io/releases/linux"
regex = "<h2>([0-9]+\\.[0-9]+\\.[0-9]+)</h2>"

[python3-pathvalidate]
source = "pypi"
pypi = "pathvalidate"

[python3-onnxruntime]
source = "pypi"
pypi = "onnxruntime"

[piper-tts]
source = "github"
